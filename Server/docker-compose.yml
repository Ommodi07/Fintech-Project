services:
  postgres:
    image: postgres:15-alpine
    container_name: fintech-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fintech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fintech-network

  fintech-server:
    build: .
    # Removed container_name to allow scaling
    depends_on:
      postgres:
        condition: service_healthy
    # No direct port exposure - only through nginx
    expose:
      - "5000"
    environment:
      - GEMINI_API_KEY=AIzaSyD9f5SnhL-O5zLb3BY_jfH6_hFD-nxy1E0
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fintech_db
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=false
    env_file:
      - .env
    volumes:
      - ./categorized_transactions.json:/app/categorized_transactions.json
      - temp_uploads:/app/temp_uploads
      - extracted_images:/app/extracted_images
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fintech-network
    # Deploy configuration for scaling
    deploy:
      replicas: 1  # Keep low to avoid Gemini API rate limits
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: fintech-nginx
    depends_on:
      - fintech-server
    ports:
      - "5000:80"  # Expose nginx on port 5000
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - fintech-network

volumes:
  temp_uploads:
  extracted_images:
  postgres_data:
  nginx_logs:

networks:
  fintech-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400