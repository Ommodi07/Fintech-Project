[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-mcp-server"
version = "0.1.0"
description = "A Finance-focused MCP server"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.24.0",
    "nest-asyncio>=1.5.0",
]
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
finance-mcp-server = "main:main"

# Add optional dependencies for development
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0",
    "flake8>=5.0",
]

[tool.uv]
dev-dependencies = []

# Code formatting with Black
[tool.black]
line-length = 88
target-version = ['py38']

# Testing configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
